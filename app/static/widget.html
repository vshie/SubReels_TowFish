<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Recorder Widget</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 8px;
        }

        .widget {
            width: 100%;
            max-width: 320px;
            background: #2a2a2a;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }

        .mode-switch {
            display: flex;
            background: #1c1c1c;
            border-radius: 6px;
            padding: 3px;
            margin-bottom: 12px;
        }

        .mode-switch button {
            flex: 1;
            background: transparent;
            color: #aaa;
            border: none;
            padding: 6px 0;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.4px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s, color 0.15s;
        }

        .mode-switch button.active {
            background: #3a3a3a;
            color: #fff;
        }

        .mode-switch button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .rec-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #555;
            flex-shrink: 0;
            transition: background 0.3s;
        }

        .rec-dot.active.video {
            background: #e53935;
            animation: pulse 1.2s infinite;
        }

        /* Transect monitor: blue while a leg is recording, slower-pulse
           amber while the monitor is enabled but waiting for the boat
           to start navigating (state == "waiting"). */
        .rec-dot.active.transect {
            background: #4fc3f7;
            box-shadow: 0 0 8px #4fc3f7;
        }
        .rec-dot.armed-transect {
            background: #ffd54f;
            box-shadow: 0 0 8px #ffd54f;
            animation: pulse 1.8s ease-in-out infinite;
            display: inline-block;
        }

        .rec-dot.active.timelapse {
            background: #fb8c00;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .duration {
            margin-left: auto;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 13px;
            color: #999;
        }

        .duration.active { color: #ef9a9a; }
        .duration.active.timelapse { color: #ffcc80; }
        .duration.active.transect { color: #4fc3f7; }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            letter-spacing: 0.4px;
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-start {
            background: #43a047;
            color: #fff;
        }
        .btn-start:hover:not(:disabled) { background: #388e3c; }

        .btn-stop {
            background: #e53935;
            color: #fff;
        }
        .btn-stop:hover:not(:disabled) { background: #c62828; }

        .btn-stop.timelapse { background: #fb8c00; }
        .btn-stop.timelapse:hover:not(:disabled) { background: #ef6c00; }
        .btn-stop.transect { background: #0288d1; }
        .btn-stop.transect:hover:not(:disabled) { background: #01579b; }

        .file-info {
            margin-top: 12px;
            padding: 10px;
            background: #222;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            min-height: 38px;
        }

        .file-name {
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .file-size {
            font-family: "SF Mono", "Fira Code", monospace;
            font-weight: 600;
            color: #90caf9;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .file-size.timelapse { color: #ffcc80; }
        .file-size.transect  { color: #4fc3f7; }

        .stats-row {
            margin-top: 6px;
            font-size: 11px;
            color: #888;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .stats-row span.warn { color: #ef9a9a; }

        .error-msg {
            margin-top: 8px;
            padding: 6px 8px;
            background: #4a1c1c;
            border-radius: 4px;
            font-size: 11px;
            color: #ef9a9a;
            display: none;
        }
    </style>
</head>
<body>
    <div class="widget">
        <div class="mode-switch" id="modeSwitch">
            <button id="modeVideoBtn" class="active" onclick="setMode('video')">VIDEO</button>
            <button id="modeTimelapseBtn" onclick="setMode('timelapse')">TIMELAPSE 2 Hz</button>
            <button id="modeTransectBtn"  onclick="setMode('transect')">TRANSECT AUTO</button>
        </div>

        <div class="header">
            <div class="rec-dot" id="recDot"></div>
            <span class="title" id="modeTitle">Video Recorder</span>
            <span class="duration" id="duration">00:00:00</span>
        </div>

        <button class="btn btn-start" id="actionBtn" onclick="toggleActive()">
            Start Recording
        </button>

        <div class="file-info">
            <span class="file-name" id="fileName">No files yet</span>
            <span class="file-size" id="fileSize"></span>
        </div>

        <div class="stats-row" id="statsRow"></div>

        <div class="error-msg" id="errorMsg"></div>
    </div>

<script>
const actionBtn       = document.getElementById('actionBtn');
const recDot          = document.getElementById('recDot');
const durationEl      = document.getElementById('duration');
const fileNameEl      = document.getElementById('fileName');
const fileSizeEl      = document.getElementById('fileSize');
const errorMsg        = document.getElementById('errorMsg');
const modeVideoBtn    = document.getElementById('modeVideoBtn');
const modeTimelapseBtn= document.getElementById('modeTimelapseBtn');
const modeTransectBtn = document.getElementById('modeTransectBtn');
const modeTitle       = document.getElementById('modeTitle');
const statsRow        = document.getElementById('statsRow');

// Local mode selection (what the user has *picked*); the active mode
// reported by the server is in serverMode and overrides UI when active.
let selectedMode = 'video';
let serverMode   = 'idle';
// Transect monitor state: 'disabled' | 'waiting' | 'recording'. The
// monitor can be enabled (waiting) while serverMode is still 'idle';
// we keep this separate so the action button correctly reads "Disable
// Transect Auto" even before the boat starts navigating.
let transectMonState = 'disabled';
let startTime    = null;
let durationTimer= null;

function isActive() {
    return serverMode === 'video'
        || serverMode === 'timelapse'
        || serverMode === 'transect';
}

function isTransectOwned() {
    // True whenever the transect monitor is in charge -- either
    // currently recording a leg or just waiting for the mission to
    // start. Used so the mode-switch buttons lock to TRANSECT AUTO
    // while the monitor is engaged.
    return serverMode === 'transect' || transectMonState !== 'disabled';
}

function activeMode() {
    if (isTransectOwned()) return 'transect';
    return isActive() ? serverMode : selectedMode;
}

function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

function formatDuration(ms) {
    const s  = Math.floor(ms / 1000) % 60;
    const m  = Math.floor(ms / 60000) % 60;
    const h  = Math.floor(ms / 3600000);
    return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
}

function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
    setTimeout(() => { errorMsg.style.display = 'none'; }, 5000);
}

function setMode(m) {
    // Block mode changes while ANY mode is engaged (manual recording,
    // timelapse, or transect monitor enabled).
    if (isActive() || isTransectOwned()) return;
    selectedMode = m;
    modeVideoBtn.classList.toggle('active',     m === 'video');
    modeTimelapseBtn.classList.toggle('active', m === 'timelapse');
    modeTransectBtn.classList.toggle('active',  m === 'transect');
    renderUI();
}

function renderUI() {
    const m = activeMode();
    const active = isActive();
    const transectOwned = isTransectOwned();

    if (m === 'video') {
        modeTitle.textContent = 'Video Recorder';
        actionBtn.textContent = active ? 'Stop Recording' : 'Start Recording';
    } else if (m === 'timelapse') {
        modeTitle.textContent = 'Timelapse Snapshots';
        actionBtn.textContent = active ? 'Stop Timelapse' : 'Start Timelapse';
    } else {
        // Transect: action toggles the monitor, not the recording.
        // Title shows the underlying sub-state so the operator can
        // tell the difference between "armed but waiting" and "recording".
        if (transectMonState === 'recording') {
            modeTitle.textContent = 'Transect Auto -- Recording';
        } else if (transectMonState === 'waiting') {
            modeTitle.textContent = 'Transect Auto -- Waiting for AUTO';
        } else {
            modeTitle.textContent = 'Transect Auto';
        }
        actionBtn.textContent = transectOwned
            ? 'Disable Transect Auto'
            : 'Enable Transect Auto';
    }

    actionBtn.className = 'btn ' + ((active || transectOwned) ? 'btn-stop' : 'btn-start');
    if (active && m === 'timelapse') actionBtn.classList.add('timelapse');
    if (transectOwned)               actionBtn.classList.add('transect');

    recDot.className = 'rec-dot';
    durationEl.className = 'duration';
    if (active) {
        recDot.classList.add('active', m);
        durationEl.classList.add('active');
        if (m === 'timelapse') durationEl.classList.add('timelapse');
        if (m === 'transect')  durationEl.classList.add('transect');
    } else if (transectOwned && transectMonState === 'waiting') {
        // Distinct "armed but not yet recording" indicator.
        recDot.classList.add('armed-transect');
    }

    // Lock mode buttons while anything is engaged so the operator
    // can't accidentally switch tracks mid-mission.
    const lock = active || transectOwned;
    modeVideoBtn.disabled = lock;
    modeTimelapseBtn.disabled = lock;
    modeTransectBtn.disabled = lock;
    actionBtn.disabled = false;
}

function startDurationTimer(serverDurationSec) {
    if (serverDurationSec !== undefined && serverDurationSec > 0) {
        startTime = new Date(Date.now() - serverDurationSec * 1000);
    } else if (!startTime) {
        startTime = new Date();
    }
    if (!durationTimer) {
        durationTimer = setInterval(() => {
            durationEl.textContent = formatDuration(Date.now() - startTime.getTime());
        }, 500);
    }
}

function stopDurationTimer() {
    clearInterval(durationTimer);
    durationTimer = null;
    startTime = null;
    durationEl.textContent = '00:00:00';
}

async function toggleActive() {
    actionBtn.disabled = true;
    errorMsg.style.display = 'none';

    // Pick endpoint based on what's *currently* engaged. Transect has
    // its own enable/disable pair because the recording start is
    // delegated to the monitor (it spins up a RecordingSession when
    // the boat starts navigating, not when the user clicks).
    let endpoint;
    const transectOwned = isTransectOwned();
    if (transectOwned) {
        endpoint = '/transect/disable';
    } else if (isActive()) {
        endpoint = serverMode === 'timelapse' ? '/timelapse/stop' : '/stop';
    } else if (selectedMode === 'transect') {
        endpoint = '/transect/enable';
    } else if (selectedMode === 'timelapse') {
        endpoint = '/timelapse/start';
    } else {
        endpoint = '/start';
    }

    try {
        const res  = await fetch(endpoint);
        const data = await res.json();
        if (!data.success) {
            showError(data.message || 'Request failed');
            actionBtn.disabled = false;
            return;
        }
        // Optimistic UI update; pollStatus will reconcile within ~2 s.
        if (endpoint === '/transect/enable') {
            transectMonState = 'waiting';
        } else if (endpoint === '/transect/disable') {
            transectMonState = 'disabled';
            serverMode = 'idle';
            stopDurationTimer();
        } else if (endpoint.endsWith('/start') || endpoint === '/timelapse/start') {
            serverMode = selectedMode;
            startDurationTimer();
        } else {
            serverMode = 'idle';
            stopDurationTimer();
        }
        renderUI();
    } catch (e) {
        showError('Connection error');
        actionBtn.disabled = false;
    }
}

async function pollStatus() {
    try {
        const res  = await fetch('/status');
        const data = await res.json();
        const newMode = data.mode || (data.recording ? 'video' : 'idle');
        const wasActive = isActive() || isTransectOwned();
        serverMode = newMode;
        // Capture monitor state separately so we know "monitor enabled
        // but waiting" -- the recorder mode goes back to 'idle' between
        // legs but the monitor is still in charge.
        const tx = data.transect || null;
        transectMonState = tx && tx.enabled ? (tx.state || 'waiting') : 'disabled';

        if (isActive()) {
            // Sync the selected mode to whatever the server is doing so
            // the UI doesn't flip mid-recording on external start. The
            // transect mode also locks selectedMode below.
            if (selectedMode !== serverMode && !isTransectOwned()) {
                selectedMode = serverMode;
                modeVideoBtn.classList.toggle('active',     serverMode === 'video');
                modeTimelapseBtn.classList.toggle('active', serverMode === 'timelapse');
                modeTransectBtn.classList.toggle('active',  serverMode === 'transect');
            }
            startDurationTimer(data.duration_seconds);
        } else if (wasActive && !isTransectOwned()) {
            stopDurationTimer();
        }

        // While the monitor is engaged, the UI should always show
        // TRANSECT AUTO as the selected mode so the button labels and
        // colours line up.
        if (isTransectOwned()) {
            selectedMode = 'transect';
            modeVideoBtn.classList.toggle('active',     false);
            modeTimelapseBtn.classList.toggle('active', false);
            modeTransectBtn.classList.toggle('active',  true);
        }

        // Stats line
        if (serverMode === 'video' && !isTransectOwned()) {
            const restarts = data.restarts || 0;
            const errs = data.gst_errors || 0;
            const stalls = data.file_stalls || 0;
            const parts = [];
            if (restarts > 0) parts.push(`<span class="warn">restarts: ${restarts}</span>`);
            if (errs > 0)     parts.push(`<span class="warn">errs: ${errs}</span>`);
            if (stalls > 0)   parts.push(`<span class="warn">stalls: ${stalls}</span>`);
            parts.push(`free: ${data.disk_free_mb || 0} MB`);
            statsRow.innerHTML = parts.join(' &middot; ');
        } else if (serverMode === 'timelapse') {
            const tl = data.timelapse || {};
            const parts = [`snaps: ${tl.snap_count || 0}`];
            if (tl.miss_count > 0) parts.push(`<span class="warn">misses: ${tl.miss_count}</span>`);
            // Sync skew = ms between snap & GPS sample landing.
            // Highlight in yellow if either GPS lagged the snap by
            // more than half a snap period (250 ms @ 2 Hz).
            const skew = tl.last_sync_skew_ms;
            if (typeof skew === 'number' && skew >= 0) {
                const cls = skew > 250 ? 'warn' : '';
                parts.push(`<span class="${cls}">sync: ${skew.toFixed(0)} ms</span>`);
            }
            parts.push(`free: ${data.disk_free_mb || 0} MB`);
            statsRow.innerHTML = parts.join(' &middot; ');
        } else if (isTransectOwned()) {
            // Transect status line: state, current seq + leg count,
            // wp_dist when navigating, AUTO/armed flags, and the most
            // recent event so the operator can see what just happened.
            const parts = [`state: <strong>${tx.state}</strong>`];
            if (tx.mission_seq !== null && tx.mission_seq !== undefined) {
                parts.push(`seq: ${tx.mission_seq}`);
            }
            if (tx.leg_count > 0) parts.push(`legs: ${tx.leg_count}`);
            if (typeof tx.wp_dist === 'number' && tx.wp_dist > 0) {
                parts.push(`wp_dist: ${tx.wp_dist.toFixed(1)} m`);
            }
            const flags = [];
            if (tx.mode_num !== 10) flags.push(`mode=${tx.mode_num}`);
            if (tx.armed === false) flags.push('disarmed');
            if (flags.length) parts.push(`<span class="warn">${flags.join(' ')}</span>`);
            parts.push(`free: ${data.disk_free_mb || 0} MB`);
            statsRow.innerHTML = parts.join(' &middot; ');
        } else {
            statsRow.innerHTML = '';
        }

        renderUI();
    } catch (_) {}
}

async function pollFileSize() {
    try {
        const res  = await fetch('/filesize');
        const data = await res.json();
        if (data.success && data.filename) {
            let label = data.filename;
            if (data.mode === 'timelapse' && data.snap_count !== undefined) {
                label = `${data.filename} (${data.snap_count})`;
            }
            fileNameEl.textContent = label;
            fileSizeEl.textContent = formatBytes(data.size_bytes);
            fileSizeEl.classList.toggle('timelapse', data.mode === 'timelapse');
            fileSizeEl.classList.toggle('transect',  data.mode === 'transect');
        } else {
            fileNameEl.textContent = 'No files yet';
            fileSizeEl.textContent = '';
            fileSizeEl.classList.remove('timelapse');
            fileSizeEl.classList.remove('transect');
        }
    } catch (_) {}
}

renderUI();
pollStatus();
pollFileSize();

setInterval(pollStatus,   2000);
setInterval(pollFileSize,  1000);
</script>
</body>
</html>
