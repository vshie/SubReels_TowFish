name: Deploy BlueOS Extension Image

on:
  # Automatically run when a new commit is added to the repository
  push:
  # Automatically run when someone makes a Pull Request to the repository
  #pull_request:
  # Run manually
  #workflow_dispatch:
  # NOTE: caches may be removed if not run weekly
  #  -> may be worth scheduling for every 6 days

jobs:
  deploy-docker-image:
    runs-on: ubuntu-latest
    # svenstaro/upload-release-action (invoked by the BlueOS deploy action
    # on tag pushes) attaches the built per-arch .tar files to the GitHub
    # Release for the tag. That requires contents: write on the workflow
    # token; the repo default is read-only, so tag builds fail at the
    # upload step with "Resource not accessible by integration". Regular
    # branch pushes never hit that step, which is why every non-tag run
    # up to v0.99 was green.
    permissions:
      contents: write
    steps:
      - name: Clear Docker cache
        run: |
          docker builder prune -f
          docker buildx prune -f

      - name: Deploy BlueOS Extension
        uses: BlueOS-community/Deploy-BlueOS-Extension@v1.2.0
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: 'subreels_towfish'          
          author: ${{ vars.MY_NAME }}
          author-email: ${{ vars.MY_EMAIL }}
          maintainer: ${{ vars.ORG_NAME }}
          maintainer-email: ${{ vars.ORG_EMAIL }}

  # The tow boat side: a tiny service that advertises the fish's widget to
  # the boat's Cockpit (link/). Published as blueos-subreels_towfish_link.
  deploy-link-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Deploy BlueOS Extension
        uses: BlueOS-community/Deploy-BlueOS-Extension@v1.2.0
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: 'subreels_towfish_link'
          dockerfile-location: 'link'
          author: ${{ vars.MY_NAME }}
          author-email: ${{ vars.MY_EMAIL }}
          maintainer: ${{ vars.ORG_NAME }}
          maintainer-email: ${{ vars.ORG_EMAIL }}
